<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark Terminal Rounded Background -->
  <rect width="512" height="512" rx="104" fill="#090a0f"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#27272a" stroke-width="8"/>

  <!-- Horseshoe Magnet Body -->
  <!-- Outer horseshoe curve and straight arms -->
  <path d="M 160 140 L 160 250 C 160 302.9 203.1 346 256 346 C 308.9 346 352 302.9 352 250 L 352 140"
        fill="none" stroke="#f4f4f5" stroke-width="48" stroke-linecap="square" stroke-linejoin="round"/>

  <!-- Left Pole Cap (N) -->
  <rect x="136" y="110" width="48" height="40" rx="4" fill="#f4f4f5"/>
  <line x1="136" y1="130" x2="184" y2="130" stroke="#090a0f" stroke-width="6"/>

  <!-- Right Pole Cap (S) -->
  <rect x="328" y="110" width="48" height="40" rx="4" fill="#f4f4f5"/>
  <line x1="328" y1="130" x2="376" y2="130" stroke="#090a0f" stroke-width="6"/>

  <!-- Media / Video Play Triangle Being Attracted into the Magnet Core -->
  <polygon points="238,212 284,240 238,268" fill="#f4f4f5"/>

  <!-- Magnetic Waves / Field Lines being pulled upward -->
  <path d="M 224 160 C 240 148 272 148 288 160" fill="none" stroke="#71717a" stroke-width="8" stroke-linecap="round"/>
  <path d="M 212 182 C 234 168 278 168 300 182" fill="none" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round"/>
</svg>
